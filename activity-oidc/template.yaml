  # --- Infrastructure role (environment:infrastructure) ---

  InfraRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${GitHubRepo}-github-actions-infra
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
