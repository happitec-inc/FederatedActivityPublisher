                  - s3:PutAccelerateConfiguration
                  - s3:PutAnalyticsConfiguration
                  - s3:PutBucketAbac
                  - s3:PutBucketAcl
                  - s3:PutBucketCORS
                  - s3:PutBucketLogging
                  - s3:PutBucketNotification
                  - s3:PutBucketObjectLockConfiguration
                  - s3:PutBucketOwnershipControls
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutBucketTagging
                  - s3:PutBucketVersioning
                  - s3:PutBucketWebsite
                  - s3:PutEncryptionConfiguration
                  - s3:PutIntelligentTieringConfiguration
                  - s3:PutInventoryConfiguration
                  - s3:PutLifecycleConfiguration
                  - s3:PutMetricsConfiguration
                  - s3:PutReplicationConfiguration
                  - s3:TagResource
                  - s3:UntagResource
                  - s3:UpdateBucketMetadataAnnotationTableConfiguration
                  - s3:UpdateBucketMetadataInventoryTableConfiguration
                  - s3:UpdateBucketMetadataJournalTableConfiguration
                Resource:
                  - arn:aws:s3:::activity-media-stage
                  - arn:aws:s3:::activity-media-prod
              - Sid: Table
                Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:UpdateTable
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:UpdateTimeToLive
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:UpdateContinuousBackups
                  - dynamodb:DescribeContributorInsights
                  - dynamodb:UpdateContributorInsights
                  - dynamodb:DescribeKinesisStreamingDestination
                  - dynamodb:EnableKinesisStreamingDestination
                  - dynamodb:DisableKinesisStreamingDestination
                  - dynamodb:UpdateKinesisStreamingDestination
                  - dynamodb:GetResourcePolicy
                  - dynamodb:PutResourcePolicy
                  - dynamodb:DeleteResourcePolicy
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                  - dynamodb:ListTagsOfResource
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/activity-stage
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/activity-stage/index/*
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/activity-prod
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/activity-prod/index/*
              - Sid: Queues
                Effect: Allow
                Action:
                  - sqs:GetQueueAttributes
                  - sqs:SetQueueAttributes
                  - sqs:ListQueueTags
                  - sqs:TagQueue
                  - sqs:UntagQueue
                Resource:
                  - !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:activity-delivery-stage
                  - !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:activity-delivery-prod
                  - !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:activity-delivery-dlq-stage
                  - !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:activity-delivery-dlq-prod
              - Sid: AlarmTopic
                Effect: Allow
                Action:
                  - sns:CreateTopic
                  - sns:DeleteTopic
                  - sns:GetTopicAttributes
                  - sns:SetTopicAttributes
                  - sns:Subscribe
                  - sns:Unsubscribe
                  - sns:ListSubscriptionsByTopic
                  - sns:GetDataProtectionPolicy
                  - sns:PutDataProtectionPolicy
                  - sns:TagResource
                  - sns:UntagResource
                  - sns:ListTagsForResource
                Resource:
                  - !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:activity-dlq-alarm-stage
                  - !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:activity-dlq-alarm-prod
              - Sid: Alarm
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                  - cloudwatch:ListTagsForResource
                Resource:
                  - !Sub arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:activity-dlq-depth-stage
                  - !Sub arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:activity-dlq-depth-prod
              - Sid: AlarmRead
                Effect: Allow
                Action: cloudwatch:DescribeAlarms
                Resource: "*"
              - Sid: BootstrapZone
                Effect: Allow
                Action:
                  - route53:GetHostedZone
                  - route53:GetChange
                  - route53:ListTagsForResource
                  - route53:ChangeTagsForResource
                  - route53:UpdateHostedZoneComment
                  - route53:UpdateHostedZoneFeatures
                  - route53:CreateQueryLoggingConfig
                  - route53:DeleteQueryLoggingConfig
                  - route53:ListQueryLoggingConfigs
                Resource:
                  - !Sub
                    - arn:aws:route53:::hostedzone/${Zone}
                    - Zone: !ImportValue
                        Fn::Sub: ${BootstrapStackName}-HostedZoneId
                  - arn:aws:route53:::change/*
              - Sid: BootstrapCertificate
                Effect: Allow
                Action:
                  - acm:DescribeCertificate
                  - acm:ListTagsForCertificate
                  - acm:AddTagsToCertificate
                  - acm:RemoveTagsFromCertificate
                  - acm:UpdateCertificateOptions
                Resource: !ImportValue
                  Fn::Sub: ${BootstrapStackName}-CertificateArn
              - Sid: FunctionBoundaries
                Effect: Allow
                Action:
                  - iam:CreatePolicy
                  - iam:CreatePolicyVersion
                  - iam:DeletePolicyVersion
                  - iam:DeletePolicy
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListPolicyVersions
                  - iam:ListEntitiesForPolicy
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:policy/activity-app-stage-function-boundary
                  - !Sub arn:aws:iam::${AWS::AccountId}:policy/activity-app-prod-function-boundary
      Tags:
        - Key: Project
          Value: !Ref GitHubRepo

  # --- Integration read role (environment:integration) ---

  IntegrationReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${GitHubRepo}-github-actions-integration-read
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOrg}/${GitHubRepo}:environment:integration
                  - !Sub repo:${GitHubOrg}@${GitHubOrgId}/${GitHubRepo}@${GitHubRepoId}:environment:integration
      Policies:
        - PolicyName: integration-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AppOutputs
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/activity-app-stage/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/activity-app-prod/*
              - Sid: ProdClientToken
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/activity/prod/keys/client-token
              - Sid: DecryptViaSsm
                Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Tags:
        - Key: Project
          Value: !Ref GitHubRepo

  # --- Trust-check role (environment:trust-check), read-only ---

  TrustCheckRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${GitHubRepo}-github-actions-trust-check
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOrg}/${GitHubRepo}:environment:trust-check
                  - !Sub repo:${GitHubOrg}@${GitHubOrgId}/${GitHubRepo}@${GitHubRepoId}:environment:trust-check
      Policies:
        - PolicyName: trust-check
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListRoles
                Effect: Allow
                Action: iam:ListRoles
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/*
              - Sid: ReadAppRoles
                Effect: Allow
                Action: iam:GetRole
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/activity-app-stage-*
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/activity-app-prod-*
              - Sid: AppStacks
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackResource
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/activity-app-stage/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/activity-app-stage-*/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/activity-app-prod/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/activity-app-prod-*/*
      Tags:
        - Key: Project
          Value: !Ref GitHubRepo

Outputs:
  StageDeployRoleName:
    Description: Role assumed by deploy-stage.yml (environment stage)
    Value: !Ref StageDeployRole
  ProdDeployRoleName:
    Description: Role assumed by deploy-prod.yml (environment production)
    Value: !Ref ProdDeployRole
  InfraRoleName:
    Description: Role assumed by environment.yml and bootstrap.yml (environment infrastructure)
    Value: !Ref InfraRole
  IntegrationReadRoleName:
    Description: Role assumed by run-integration-tests.yml (environment integration)
    Value: !Ref IntegrationReadRole
  TrustCheckRoleName:
    Description: Role assumed by oidc-trust-check.yml job inventory (environment trust-check)
    Value: !Ref TrustCheckRole
