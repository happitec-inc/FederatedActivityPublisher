name: Deploy Prod
run-name: "Deploy Prod (${{ github.event.release.tag_name || 'manual' }})"

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  STAGE: prod
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  build-and-deploy:
    if: >-
      vars.SERVER_DOMAIN &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.release.prerelease == false && startsWith(github.event.release.tag_name, 'v')))
    runs-on: ${{ vars.RUNNER_LABELS_LINUX && fromJSON(vars.RUNNER_LABELS_LINUX) || 'ubuntu-24.04-arm' }}
    environment:
      name: production
      url: https://${{ vars.SERVER_DOMAIN || 'activity.example.com' }}
    steps:
      - name: Clean workspace (self-hosted)
        if: ${{ vars.RUNNER_LABELS_LINUX }}
        run: |
          sudo rm -rf .build/ || true
          sudo git clean -fdx -e .git || true
          docker container prune -f || true
          docker builder prune -af --filter "until=24h" || true

      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: false

      - name: Substitute domain variables
        run: |
          SERVER_DOMAIN="${{ vars.SERVER_DOMAIN }}" \
          HANDLE_DOMAIN="${{ vars.HANDLE_DOMAIN }}" \
          bash scripts/substitute-variables.sh

      - name: Install Docker
        run: |
          if command -v docker &>/dev/null; then
            echo "Docker already installed"
          else
            curl -fsSL https://get.docker.com | sudo sh
          fi
          sudo chmod 666 /var/run/docker.sock
          docker --version

      - name: Cache Docker image
        uses: actions/cache@v5
        with:
          path: /tmp/docker-image.tar
          key: docker-al2023-swift-${{ hashFiles('docker/Dockerfile.al2023-swift') }}

      - name: Load or build AL2023 Swift Docker image
        run: |
          if [ -f /tmp/docker-image.tar ]; then
            echo "Loading cached Docker image"
            docker load < /tmp/docker-image.tar
          else
            echo "Building Docker image"
            docker build -t swift-al2023:6.3 -f docker/Dockerfile.al2023-swift .
            docker save swift-al2023:6.3 > /tmp/docker-image.tar
          fi

      # The build cache is keyed on the committed Package.resolved plus the
      # build image's Dockerfile: a restored .build only helps when both the
      # pinned dependencies and the toolchain match. The key is computed once,
      # before the build, so restore and save use the same one.
      - name: Compute Swift build cache key
        id: swift-cache
        run: |
          HASH=$(cat Package.resolved docker/Dockerfile.al2023-swift | sha256sum | cut -c1-16)
          echo "prefix=swift-al2023-$HASH" >> "$GITHUB_OUTPUT"

      - name: Restore Swift build cache
        uses: happitec-inc/public-actions/swift-build-cache-restore@main
        with:
          key-prefix: ${{ steps.swift-cache.outputs.prefix }}

      # One container: resolve once against Package.resolved, one swift build
      # for every product, then zip the template's handlers with the OpenSSL
      # libs. Runs as the runner uid so .build is never root-owned.
      - name: Build Lambda zips
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/home \
            -v "$(pwd):/workspace" \
            -w /workspace \
            swift-al2023:6.3 \
            bash scripts/build-all-lambdas.sh

      - name: Save Swift build cache
        if: always()
        uses: happitec-inc/public-actions/swift-build-cache-save@main
        with:
          key-prefix: ${{ steps.swift-cache.outputs.prefix }}

      - name: Install SAM CLI
        uses: ./.github/actions/setup-sam-portable

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package and deploy with SAM
        run: |
          sam package \
            --template-file activity-app/template.yaml \
            --output-template-file packaged.yaml \
            --resolve-s3 \
            --region $AWS_REGION

          sam deploy \
            --template-file packaged.yaml \
            --stack-name "activity-app-prod" \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --region $AWS_REGION \
            --parameter-overrides \
              Stage=prod \
              EnvironmentStackName=activity-environment-prod \
              BootstrapStackName=activity-bootstrap \
              ServerDomain=${{ vars.SERVER_DOMAIN }} \
              HandleDomain=${{ vars.HANDLE_DOMAIN }} \
              ProxyDistributionId=${{ vars.PROXY_DISTRIBUTION_ID }} \
              ActivityDistributionId=${{ vars.ACTIVITY_DISTRIBUTION_ID_PROD }} \
              ClientApiDomain=${{ vars.CLIENT_API_DOMAIN_PROD }} \
              "InstanceTitle=\"${{ vars.INSTANCE_TITLE || 'FederatedActivityPublisher' }}\"" \
              "InstanceDescription=\"${{ vars.INSTANCE_DESCRIPTION || 'A serverless ActivityPub server powered by FederatedActivityPublisher.' }}\"" \
              "SourceUrl=\"${{ vars.SOURCE_URL || 'https://github.com/happitec-inc/FederatedActivityPublisher' }}\""

      - name: Upload frontend assets
        run: |
          MEDIA_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "activity-environment-prod" \
            --query "Stacks[0].Outputs[?OutputKey=='MediaBucketName'].OutputValue" \
            --output text \
            --region $AWS_REGION 2>/dev/null || echo "")
          if [ -n "$MEDIA_BUCKET" ] && [ "$MEDIA_BUCKET" != "None" ]; then
            aws s3 sync frontend/ "s3://$MEDIA_BUCKET/media/frontend/" \
              --cache-control "public, max-age=31536000, immutable"
            echo "Uploaded frontend assets to s3://$MEDIA_BUCKET/media/frontend/"
          else
            echo "Warning: Could not determine media bucket name, skipping frontend upload"
          fi

      - name: Print stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "activity-app-prod" \
            --query "Stacks[0].Outputs" \
            --output table \
            --region $AWS_REGION >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
