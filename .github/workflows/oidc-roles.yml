name: Deploy OIDC Role Stack

# Deploys activity-oidc/template.yaml as FederatedActivityPublisher-oidc.
# Dispatch only, from main, in the oidc-bootstrap environment. The deploy
# output goes to a file under RUNNER_TEMP and is never printed or uploaded;
# failure detail is read from the stack events in the CloudFormation console.

on:
  workflow_dispatch:
    inputs:
      allow-distribution-create:
        description: "Let the deploy roles create a CloudFront distribution (first deployment only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: oidc-roles
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: oidc-bootstrap
    runs-on: ${{ vars.RUNNER_LABELS_LINUX && fromJSON(vars.RUNNER_LABELS_LINUX) || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install SAM CLI
        uses: ./.github/actions/setup-sam-portable

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.OIDC_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy role stack
        env:
          REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          STAGE_DISTRIBUTION_ID: ${{ vars.ACTIVITY_DISTRIBUTION_ID_STAGE }}
          PROD_DISTRIBUTION_ID: ${{ vars.ACTIVITY_DISTRIBUTION_ID_PROD }}
          ALLOW_DISTRIBUTION_CREATE: ${{ inputs.allow-distribution-create }}
        run: |
          # Values are quoted so an empty variable still reaches CloudFormation
          # as an empty parameter, which the template's Rules then refuse.
          if sam deploy \
              --template-file activity-oidc/template.yaml \
              --stack-name FederatedActivityPublisher-oidc \
              --capabilities CAPABILITY_NAMED_IAM \
              --no-confirm-changeset \
              --no-fail-on-empty-changeset \
              --region "$REGION" \
              --parameter-overrides \
                "StageDistributionId=\"${STAGE_DISTRIBUTION_ID}\"" \
                "ProdDistributionId=\"${PROD_DISTRIBUTION_ID}\"" \
                "AllowDistributionCreate=\"${ALLOW_DISTRIBUTION_CREATE}\"" \
              > "$RUNNER_TEMP/deploy.log" 2>&1; then
            echo "role stack: ok"
          else
            echo "role stack: failed (see the stack events in the CloudFormation console)"
            exit 1
          fi

      - name: Role names
        env:
          REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: |
          {
            echo "## Role stack outputs"
            echo '```json'
            aws cloudformation describe-stacks \
              --stack-name FederatedActivityPublisher-oidc \
              --query "Stacks[0].Outputs" \
              --region "$REGION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
