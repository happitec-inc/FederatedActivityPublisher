name: Deploy OIDC Role Stack

# Deploys activity-oidc/template.yaml as <repository name>-oidc. Dispatch
# only, from main, in the oidc-bootstrap environment. The deploy output is
# never printed or uploaded; failure detail is read from the stack events in
# the CloudFormation console.

on:
  workflow_dispatch:
    inputs:
      allow-distribution-create:
        description: "Let the deploy roles create a CloudFront distribution (first deployment only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: oidc-roles
  cancel-in-progress: false

env:
  REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  GH_OWNER: ${{ github.repository_owner }}
  GH_OWNER_ID: ${{ github.repository_owner_id }}
  GH_REPO: ${{ github.event.repository.name }}
  GH_REPO_ID: ${{ github.repository_id }}

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: oidc-bootstrap
    runs-on: ${{ vars.RUNNER_LABELS_LINUX && fromJSON(vars.RUNNER_LABELS_LINUX) || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install SAM CLI
        uses: ./.github/actions/setup-sam-portable

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ secrets.OIDC_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy role stack
        env:
          STAGE_DISTRIBUTION_ID: ${{ vars.ACTIVITY_DISTRIBUTION_ID_STAGE }}
          PROD_DISTRIBUTION_ID: ${{ vars.ACTIVITY_DISTRIBUTION_ID_PROD }}
          ALLOW_DISTRIBUTION_CREATE: ${{ inputs.allow-distribution-create }}
        run: scripts/oidc/deploy-role-stack.sh

      - name: Role names
        run: scripts/oidc/role-stack-outputs.sh
