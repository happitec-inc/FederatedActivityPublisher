name: OIDC Trust Check

# Measures the OIDC role stack from both sides: each role is assumable only
# from its own environment, each assumed role is denied what it must not do,
# and the inventory lists the function roles' trust and boundaries. The
# checks are in scripts/oidc/.
#
# This workflow deliberately binds jobs to every environment in one run. A
# check that each role refuses every other environment's subject cannot work
# otherwise. It is the one exception to keeping one environment per workflow.
#
# It shares the function-boundary concurrency group with environment.yml, so
# the boundary-policy positive control never runs during a boundary deploy.

on:
  workflow_dispatch:
    inputs:
      expect-boundary:
        description: "Which stages' function roles must carry their boundary"
        required: false
        type: choice
        default: none
        options:
          - none
          - stage
          - all

permissions:
  contents: read
  id-token: write

concurrency:
  group: function-boundary
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  EXPECT_BOUNDARY: ${{ inputs.expect-boundary || 'none' }}
  ROLE_PREFIX: ${{ github.event.repository.name }}-github-actions

jobs:
  no-environment:
    runs-on: ${{ vars.RUNNER_LABELS_LINUX && fromJSON(vars.RUNNER_LABELS_LINUX) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Every role refuses a job without an environment
        run: scripts/oidc/deny-assumes.sh deploy-stage deploy-prod infra integration-read trust-check

  stage:
    environment: stage
    runs-on: ${{ vars.RUNNER_LABELS_LINUX && fromJSON(vars.RUNNER_LABELS_LINUX) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Other roles refuse environment stage
        run: scripts/oidc/deny-assumes.sh deploy-prod infra integration-read trust-check

      - name: Assume the stage deploy role
        id: assume
        if: ${{ !cancelled() }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ github.event.repository.name }}-github-actions-deploy-stage
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Scope checks
        if: ${{ !cancelled() && steps.assume.outcome == 'success' }}
        run: scripts/oidc/scope-checks.sh stage

      - name: Boundary checks
        if: ${{ !cancelled() && steps.assume.outcome == 'success' }}
        run: scripts/oidc/boundary-checks.sh

      - name: Boundary-policy denials
        if: ${{ !cancelled() && steps.assume.outcome == 'success' }}
        run: scripts/oidc/boundary-policy-denials.sh

      - name: Clean up
        if: ${{ always() && steps.assume.outcome == 'success' }}
        run: scripts/oidc/cleanup.sh stage

  production:
    environment: production
    runs-on: ${{ vars.RUNNER_LABELS_LINUX && fromJSON(vars.RUNNER_LABELS_LINUX) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Other roles refuse environment production
        run: scripts/oidc/deny-assumes.sh deploy-stage infra integration-read trust-check

      - name: Assume the prod deploy role
        id: assume
        if: ${{ !cancelled() }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ github.event.repository.name }}-github-actions-deploy-prod
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Scope checks
        if: ${{ !cancelled() && steps.assume.outcome == 'success' }}
        run: scripts/oidc/scope-checks.sh production

      - name: Boundary-policy denials
        if: ${{ !cancelled() && steps.assume.outcome == 'success' }}
        run: scripts/oidc/boundary-policy-denials.sh

      - name: Clean up
        if: ${{ always() && steps.assume.outcome == 'success' }}
        run: scripts/oidc/cleanup.sh

  infrastructure:
    environment: infrastructure
    runs-on: ${{ vars.RUNNER_LABELS_LINUX && fromJSON(vars.RUNNER_LABELS_LINUX) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Other roles refuse environment infrastructure
        run: scripts/oidc/deny-assumes.sh deploy-stage deploy-prod integration-read trust-check

      - name: Assume the infra role
        id: assume
        if: ${{ !cancelled() }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ github.event.repository.name }}-github-actions-infra
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Scope checks
        if: ${{ !cancelled() && steps.assume.outcome == 'success' }}
        run: scripts/oidc/scope-checks.sh infrastructure

      - name: Boundary-policy positive control
        if: ${{ !cancelled() && steps.assume.outcome == 'success' }}
        run: scripts/oidc/boundary-policy-control.sh

      - name: Clean up
        if: ${{ always() && steps.assume.outcome == 'success' }}
        run: scripts/oidc/cleanup.sh

  integration:
    environment: integration
    runs-on: ${{ vars.RUNNER_LABELS_LINUX && fromJSON(vars.RUNNER_LABELS_LINUX) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Other roles refuse environment integration
        run: scripts/oidc/deny-assumes.sh deploy-stage deploy-prod infra trust-check

      - name: Assume the integration read role
        id: assume
        if: ${{ !cancelled() }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ github.event.repository.name }}-github-actions-integration-read
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Scope checks
        if: ${{ !cancelled() && steps.assume.outcome == 'success' }}
        run: scripts/oidc/scope-checks.sh integration

  inventory:
    environment: trust-check
    runs-on: ${{ vars.RUNNER_LABELS_LINUX && fromJSON(vars.RUNNER_LABELS_LINUX) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Other roles refuse environment trust-check
        run: scripts/oidc/deny-assumes.sh deploy-stage deploy-prod infra integration-read

      - name: Assume the trust-check role
        id: assume
        if: ${{ !cancelled() }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ github.event.repository.name }}-github-actions-trust-check
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Scope checks
        if: ${{ !cancelled() && steps.assume.outcome == 'success' }}
        run: scripts/oidc/scope-checks.sh inventory

      - name: Inventory
        if: ${{ !cancelled() && steps.assume.outcome == 'success' }}
        env:
          STAGE_DISTRIBUTION_ID: ${{ vars.ACTIVITY_DISTRIBUTION_ID_STAGE }}
          PROD_DISTRIBUTION_ID: ${{ vars.ACTIVITY_DISTRIBUTION_ID_PROD }}
        run: scripts/oidc/inventory.sh

      - name: Clean up
        if: ${{ always() && steps.assume.outcome == 'success' }}
        run: scripts/oidc/cleanup.sh
