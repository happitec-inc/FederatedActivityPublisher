name: Lambda Build

# Builds every deployed Lambda the same way the deploy workflows do
# (scripts/build-all-lambdas.sh in the AL2023 image) and checks the zips.
# No AWS credentials: this job never deploys anything.
#
# On demand only (Erin's call, 2026-10-21). Run it by adding the
# `lambda-build` label to a PR, or with workflow_dispatch once this file is on
# the default branch. It never runs on ordinary pushes.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

# The label is part of the group so that adding some other label to the PR
# (which also fires `labeled`) can't cancel a running build.
concurrency:
  group: lambda-build-${{ github.ref }}-${{ github.event.label.name || github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lambda-build:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'lambda-build'
    runs-on: ${{ vars.RUNNER_LABELS_LINUX && fromJSON(vars.RUNNER_LABELS_LINUX) || 'ubuntu-24.04-arm' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Restore only: deploys on main save the image; an on-demand run reads
      # main's copy and never saves a PR-scoped 1 GiB one.
      - name: Restore Docker image cache
        uses: actions/cache/restore@v5
        with:
          path: /tmp/docker-image.tar
          key: docker-al2023-swift-${{ hashFiles('docker/Dockerfile.al2023-swift') }}

      - name: Load or build AL2023 Swift Docker image
        run: bash scripts/load-build-image.sh

      - name: Docker limits and disk
        run: docker info --format 'docker NCPU={{.NCPU}} MemTotal={{.MemTotal}}'; df -h .

      # Restore only: a PR reads the deploy's Swift build cache for the same
      # Package.resolved and Dockerfile, but never saves one.
      - name: Compute Swift build cache key
        id: swift-cache
        run: echo "prefix=swift-al2023-$(cat Package.resolved docker/Dockerfile.al2023-swift | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore Swift build cache
        uses: happitec-inc/public-actions/swift-build-cache-restore@main
        with:
          key-prefix: ${{ steps.swift-cache.outputs.prefix }}

      - name: Build all Lambda zips
        run: scripts/in-build-image.sh scripts/build-all-lambdas.sh

      - name: Package.resolved unchanged by the build
        run: git diff --exit-code Package.resolved

      - name: Verify Lambda zips
        run: scripts/in-build-image.sh scripts/verify-lambda-zips.sh

      - name: No root-owned files in .build
        if: always()
        run: test -z "$(find .build -user root -print -quit 2>/dev/null)" || { find .build -user root | head; exit 1; }
